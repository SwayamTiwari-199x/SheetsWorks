<!DOCTYPE html>
<!--
  Control experiment. NOT part of the app and never copied into app/static by
  anything but the manual check documented below.

  WHY THIS EXISTS
  The Preview window photographs as a black rectangle under
  `chrome --headless=new --screenshot`, even though `navigator.pdfViewerEnabled`
  is true and the server reports a correct 1-page PDF in the status bar. Two
  explanations fit: the app never displays the PDF, or headless cannot render
  PDFs and the screenshot is simply uninformative.

  Three things were tried:

    1. A hand-written PDF as a data: URL. It photographed as a broken-document
       icon -- which proved only that the hand-written file was malformed (no
       xref table). Inconclusive, and worth recording because it looked like a
       result.
    2. The app's own exported PDF over plain HTTP, no blob and no app code
       (`_pdfctl2.html` + `/static/control.pdf`). It photographed as a
       broken-document icon too.
    3. The Preview window itself: black.

  Conclusion: headless Chrome does not rasterise PDF content into screenshots at
  all. A black Preview window is a property of the screenshot tool, not a defect
  in the app, and treating it as evidence -- in either direction -- is a mistake.

  SO THE PREVIEW IS VERIFIED BY OTHER MEANS
  - the iframe's src is a real blob: URL built from the server's response;
  - the status bar reports the page count and budget the server computed;
  - `document.elementFromPoint` at the frame's centre reaches the IFRAME, so
    nothing is painted over it (this is how the fallback-overlay bug was caught);
  - the "open in a new tab" link resolves to the same blob.

  TO RE-RUN
    Copy this file to app/static/_pdfctl2.html, export a version to
    app/static/control.pdf, then:
      chrome --headless=new --screenshot=out/x.png \
        http://127.0.0.1:PORT/static/_pdfctl2.html
-->
<html><head><meta charset="utf-8"><title>pdf control 2</title>
<style>
  body { background:#c0c0c0; font-family: monospace; margin:20px; }
  iframe { width:600px; height:400px; border:3px solid #000080; background:#fff; }
</style></head>
<body>
<p>real PDF over HTTP, no blob, no app code. If this is not readable, then a
black Preview window means nothing either.</p>
<iframe id="f" title="control pdf" src="/static/control.pdf"></iframe>
</body></html>
