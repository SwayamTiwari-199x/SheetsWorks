<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sheetsworks</title>
<link rel="stylesheet" href="/static/win/win95.css">
</head>
<body>

<!-- The desktop. Windows live here; the taskbar is outside it so it is never
     covered, which is exactly why Windows put it there. -->
<div id="desktop">
  <div id="desktopIcons"></div>
</div>

<!-- A modal dialog dims the desktop, as Windows grayed the owner window. -->
<div id="veil"></div>

<div id="taskbar">
  <button type="button" id="startBtn" class="btn" aria-haspopup="true" aria-expanded="false">
    <span id="startIcon" aria-hidden="true"></span>Start
  </button>
  <div id="taskButtons"></div>
  <div id="tray" role="status" title="Sound">
    <span id="trayIcon" aria-hidden="true"></span>
    <span id="trayText"></span>
  </div>
</div>

<nav id="startMenu" role="menu" aria-label="Start menu"></nav>

<!-- Injected by the server from rules.json. A <template> is inert: its contents
     are never parsed as HTML and never executed, so the JSON cannot become
     markup even if it contained a tag. "<" is escaped below for the same
     reason. This keeps the advice on screen the researched advice rather than
     a paraphrase typed into the markup. -->
<template id="tipsData">{"tips": []}</template>

<noscript>
  <div class="noscript">This program needs JavaScript. The API still works without it:
  <code>PUT /profile</code>, <code>POST /export/{version_id}</code>.</div>
</noscript>

<script src="/static/win/shell.js"></script>
<script src="/static/win/sample.js"></script>
<script src="/static/win/editor-model.js"></script>
<script src="/static/win/editor.js"></script>
<script src="/static/win/app.js"></script>
</body>
</html>
